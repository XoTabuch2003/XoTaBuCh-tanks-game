<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Танки в Лабіринті Онлайн</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow-x: hidden; padding: 5px; }
    #editor-screen, #game-screen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 800px; }
    .hidden { display: none !important; }
    
    canvas { background: #e0e0e0; border: 2px solid #444; border-radius: 6px; width: 100%; max-width: 800px; height: auto; aspect-ratio: 800 / 500; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    .controls { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
    button, input[type="text"], .file-btn { padding: 10px 18px; border-radius: 6px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    button, .file-btn { background: #4CAF50; color: white; display: inline-block; text-align: center; text-decoration: none; }
    button:active, .file-btn:active { transform: scale(0.98); }
    input[type="text"] { background: #333; color: white; border: 1px solid #555; text-align: center; }
    input[type="file"] { display: none; }
    
    #score-panel { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 800px; background: #222; padding: 8px 15px; border-radius: 6px; margin-top: 8px; font-size: 14px; font-weight: bold; }
    .ammo-dots { display: flex; gap: 4px; align-items: center; }
    .dot { width: 8px; height: 8px; background: #e74c3c; border-radius: 50%; display: inline-block; }
    .dot.empty { background: #555; }
    
    .weapon-badge { display: flex; align-items: center; gap: 6px; background: #333; padding: 3px 8px; border-radius: 4px; border: 1px solid #555; }

    #touch-controls { display: flex; justify-content: space-between; width: 100%; max-width: 800px; margin-top: 8px; padding: 0 5px; }
    .btn-touch { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
    .btn-fire { background: rgba(255, 50, 50, 0.7); width: 70px; height: 70px; }
  </style>
</head>
<body>

  <!-- Екран малювання та завантаження -->
  <div id="editor-screen">
    <h2 style="margin-bottom: 10px; font-size: 20px;">Створи свій танк або завантаж картинку!</h2>
    <canvas id="drawCanvas" width="200" height="200" style="width: 200px; height: 200px; aspect-ratio: auto;"></canvas>
    <div class="controls">
      <input type="color" id="colorPicker" value="#00bb00" style="height: 42px; width: 50px; border: none; border-radius: 6px; cursor: pointer; background: none;">
      <button onclick="clearCanvas()">Очистити</button>
      <label class="file-btn">
        📁 Завантажити фото
        <input type="file" id="uploadImage" accept="image/*" onchange="loadImage(event)">
      </label>
    </div>
    <div class="controls" style="margin-top: 8px;">
      <input type="text" id="nameInput" placeholder="Твій нікнейм" value="Танкіст">
      <input type="text" id="roomInput" placeholder="Код кімнати" value="main">
      <button onclick="joinGame()">В БІЙ!</button>
    </div>
  </div>

  <!-- Екран гри -->
  <div id="game-screen" class="hidden">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <!-- Панель знизу з рахунком, зброєю та кулями -->
    <div id="score-panel">
      <div id="player-name-score">Гравець: 0 очок</div>
      <div id="weaponInfo" class="weapon-badge">Зброя: Стандартна</div>
      <div class="ammo-dots" id="ammoContainer">Кулі: </div>
    </div>

    <div id="touch-controls">
      <div style="display: grid; grid-template-columns: repeat(3, 50px); gap: 3px;">
        <div></div><div class="btn-touch" id="btnUp">▲</div><div></div>
        <div class="btn-touch" id="btnLeft">◄</div><div></div><div class="btn-touch" id="btnRight">►</div>
        <div></div><div class="btn-touch" id="btnDown">▼</div><div></div>
      </div>
      <div class="btn-touch btn-fire" id="btnFire">🔥</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const drawCanvas = document.getElementById('drawCanvas');
    const ctxDraw = drawCanvas.getContext('2d');
    let drawing = false;

    function clearCanvas() {
      ctxDraw.fillStyle = '#ffffff';
      ctxDraw.fillRect(0, 0, 200, 200);
      ctxDraw.fillStyle = '#aaaaaa';
      ctxDraw.fillRect(90, 20, 20, 80);
    }
    clearCanvas();

    function loadImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          ctxDraw.fillStyle = '#ffffff';
          ctxDraw.fillRect(0, 0, 200, 200);
          ctxDraw.drawImage(img, 0, 0, 200, 200);
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }

    const getPos = (e) => {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const startDraw = (e) => { drawing = true; draw(e); };
    const stopDraw = () => { drawing = false; ctxDraw.beginPath(); };
    const draw = (e) => {
      if (!drawing) return;
      const pos = getPos(e);
      ctxDraw.lineWidth = 12;
      ctxDraw.lineCap = 'round';
      ctxDraw.strokeStyle = document.getElementById('colorPicker').value;
      ctxDraw.lineTo(pos.x, pos.y);
      ctxDraw.stroke();
      ctxDraw.beginPath();
      ctxDraw.moveTo(pos.x, pos.y);
    };

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);
    drawCanvas.addEventListener('touchstart', startDraw);
    drawCanvas.addEventListener('touchmove', draw);
    window.addEventListener('touchend', stopDraw);

    const gameCanvas = document.getElementById('gameCanvas');
    const ctxGame = gameCanvas.getContext('2d');
    const playerImages = {};
    const inputState = { forward: false, backward: false, left: false, right: false };

    function joinGame() {
      const skinData = drawCanvas.toDataURL();
      const playerName = document.getElementById('nameInput').value || 'Танкіст';
      const roomId = document.getElementById('roomInput').value || 'main';

      document.getElementById('editor-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      socket.emit('joinRoom', { roomId, playerName, skinData });
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') inputState.forward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') inputState.backward = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputState.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') inputState.right = true;
      if (e.code === 'Space') socket.emit('shoot');
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') inputState.forward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') inputState.backward = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputState.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') inputState.right = false;
    });

    const setupTouchBtn = (id, key) => {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); inputState[key] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); inputState[key] = false; });
    };
    setupTouchBtn('btnUp', 'forward');
    setupTouchBtn('btnDown', 'backward');
    setupTouchBtn('btnLeft', 'left');
    setupTouchBtn('btnRight', 'right');
    document.getElementById('btnFire').addEventListener('touchstart', (e) => { e.preventDefault(); socket.emit('shoot'); });

    setInterval(() => {
      socket.emit('playerInput', inputState);
    }, 1000 / 60);

    let mazeWalls = [];
    socket.on('initRoom', (data) => { mazeWalls = data.walls; });

    socket.on('tick', (data) => {
      ctxGame.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

      ctxGame.strokeStyle = '#333';
      ctxGame.lineWidth = 6;
      for (const w of mazeWalls) {
        ctxGame.beginPath();
        ctxGame.moveTo(w[0], w[1]);
        ctxGame.lineTo(w[2], w[3]);
        ctxGame.stroke();
      }

      if (data.powerups) {
        for (const pu of data.powerups) {
          ctxGame.fillStyle = pu.type === 'shield' ? '#3498db' : pu.type === 'homing' ? '#e74c3c' : pu.type === 'pierce' ? '#9b59b6' : pu.type === 'machinegun' ? '#e67e22' : '#2ecc71';
          ctxGame.fillRect(pu.x - 12, pu.y - 12, 24, 24);
          ctxGame.fillStyle = '#fff';
          ctxGame.font = 'bold 12px sans-serif';
          const label = pu.type === 'machinegun' ? 'M' : pu.type === 'rc' ? 'R' : pu.type[0].toUpperCase();
          ctxGame.fillText(label, pu.x - 4, pu.y + 4);
        }
      }

      if (data.miniTanks) {
        for (const rc of data.miniTanks) {
          ctxGame.fillStyle = '#d35400';
          ctxGame.fillRect(rc.x - 6, rc.y - 6, 12, 12);
        }
      }

      ctxGame.fillStyle = '#c0392b';
      for (const b of data.bullets) {
        ctxGame.beginPath();
        ctxGame.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctxGame.fill();
      }

      for (const id in data.players) {
        const p = data.players[id];
        if (!p.alive) continue;

        if (!playerImages[id] && p.skin) {
          const img = new Image();
          img.src = p.skin;
          playerImages[id] = img;
        }

        ctxGame.save();
        ctxGame.translate(p.x, p.y);
        ctxGame.rotate(p.angle + Math.PI / 2);

        if (playerImages[id]) {
          ctxGame.drawImage(playerImages[id], -20, -20, 40, 40);
        } else {
          ctxGame.fillStyle = 'green';
          ctxGame.fillRect(-15, -15, 30, 30);
        }

        if (p.shield) {
          ctxGame.strokeStyle = '#3498db';
          ctxGame.lineWidth = 3;
          ctxGame.beginPath();
          ctxGame.arc(0, 0, 24, 0, Math.PI * 2);
          ctxGame.stroke();
        }

        ctxGame.restore();

        ctxGame.fillStyle = '#222';
        ctxGame.font = 'bold 12px sans-serif';
        ctxGame.textAlign = 'center';
        ctxGame.fillText(`${p.name} (${p.score})`, p.x, p.y - 28);

        // Інформація на нижній панелі для поточного гравця
        if (id === socket.id) {
          document.getElementById('player-name-score').innerText = `${p.name} | Очки: ${p.score}`;
          
          const weaponInfo = document.getElementById('weaponInfo');
          if (p.ability === 'homing') {
            weaponInfo.innerHTML = `🚀 Ракета: ${p.abilityShots}`;
          } else if (p.ability === 'pierce') {
            weaponInfo.innerHTML = `🟣 Простріл: ${p.abilityShots}`;
          } else if (p.ability === 'machinegun') {
            weaponInfo.innerHTML = `🟠 Кулемет: ${p.abilityShots}`;
          } else if (p.ability === 'rc') {
            weaponInfo.innerHTML = `🟢 RC Танк: ${p.abilityShots}`;
          } else if (p.shield) {
            weaponInfo.innerHTML = `🛡️ Щит активний`;
          } else {
            weaponInfo.innerHTML = `🔫 Зброя: Стандартна`;
          }

          const ammoContainer = document.getElementById('ammoContainer');
          ammoContainer.innerHTML = 'Кулі: ';
          for (let i = 0; i < 10; i++) {
            const dot = document.createElement('span');
            dot.className = i < p.bulletsCount ? 'dot' : 'dot empty';
            ammoContainer.appendChild(dot);
          }
        }
      }
    });
  </script>
</body>
</html>
